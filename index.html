<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0F0F0F;
      --bg-subtle: #161616;
      --text-primary: #E8E4DC;
      --text-secondary: #6B6560;
      --accent: #C9A96E;
      --border: #1E1E1E;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      line-height: 1.8;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      max-width: 860px;
      margin: 0 auto;
      padding: 96px 32px 64px;
      border-bottom: 1px solid var(--border);
    }

    .site-title {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: clamp(2.4rem, 6vw, 4rem);
      letter-spacing: -0.02em;
      color: var(--text-primary);
      line-height: 1.1;
    }

    .site-subtitle {
      margin-top: 12px;
      color: var(--text-secondary);
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Filters ── */
    .filters {
      max-width: 860px;
      margin: 0 auto;
      padding: 40px 32px 0;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      padding: 6px 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover,
    .filter-btn.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .filter-btn--all {
      color: var(--text-primary);
      border-color: var(--text-secondary);
    }

    .filter-btn--all.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── Post list ── */
    .post-list {
      max-width: 860px;
      margin: 0 auto;
      padding: 64px 32px 120px;
    }

    .post-item {
      border-top: 1px solid var(--border);
      padding: 48px 0;
    }

    .post-item--left  { padding-right: 120px; }
    .post-item--right { padding-left: 120px; }

    .post-link {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 32px;
      text-decoration: none;
      color: inherit;
    }

    .post-link:hover .post-title { color: var(--accent); }

    .post-main { flex: 1; }

    .post-title {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: clamp(1.2rem, 2.5vw, 1.6rem);
      line-height: 1.25;
      color: var(--text-primary);
      transition: color 0.2s;
    }

    .post-desc {
      margin-top: 12px;
      color: var(--text-secondary);
      font-size: 0.9rem;
      line-height: 1.7;
    }

    .post-meta {
      flex-shrink: 0;
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      padding-top: 4px;
    }

    .post-year {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--border);
      line-height: 1;
    }

    .post-date {
      font-size: 0.78rem;
      color: var(--text-secondary);
      letter-spacing: 0.06em;
    }

    .post-category {
      font-size: 0.72rem;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid var(--accent);
      padding: 2px 8px;
      margin-top: 8px;
    }

    .post-item.hidden { display: none; }

    /* ── Empty state ── */
    .empty {
      padding: 80px 0;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      .post-item--left,
      .post-item--right { padding-left: 0; padding-right: 0; }
      .post-link { flex-direction: column; }
      .post-meta { text-align: left; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <header>
    <h1 class="site-title">Blog Archive</h1>
    <p class="site-subtitle">A collection of thoughts &amp; analysis</p>
  </header>

  <nav class="filters" aria-label="分类筛选">
    <button class="filter-btn filter-btn--all active" data-cat="all">全部</button>
    <button class="filter-btn" data-cat="其他">其他</button>
  </nav>

  <main class="post-list" id="post-list">
    
    <article class="post-item post-item--left" data-category="其他">
      <a href="posts/2026-02-26-hello-world/" class="post-link">
        <div class="post-main">
          <h2 class="post-title">Hello World — 这个 Blog 是怎么来的</h2>
          <p class="post-desc">关于这个归档项目的由来：一个让 Claude Code 持续生产内容、自动部署的静态 blog 系统</p>
        </div>
        <div class="post-meta">
          <span class="post-year">Thu </span>
          <span class="post-date">eb 26</span>
          <span class="post-category">其他</span>
        </div>
      </a>
    </article>
  </main>

  <script>
    const posts = [{"slug":"2026-02-26-hello-world","title":"Hello World — 这个 Blog 是怎么来的","date":"Thu Feb 26","category":"其他","description":"关于这个归档项目的由来：一个让 Claude Code 持续生产内容、自动部署的静态 blog 系统"}];
    const buttons = document.querySelectorAll('.filter-btn');
    const items = document.querySelectorAll('.post-item');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        const cat = btn.dataset.cat;
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        items.forEach(item => {
          item.classList.toggle('hidden', cat !== 'all' && item.dataset.category !== cat);
        });
      });
    });
  </script>

</body>
</html>
